{{- if and (eq .Values.graphCredential.type "secret") .Values.graphCredential.secret.create (not .Values.graphCredential.secret.existingSecret) }}
# Prefer graphCredential.secret.existingSecret, managed by an external secrets
# controller, over committing a client secret to a values file.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mcp-oauth-proxy.graphSecretName" . }}
  labels:
    {{- include "mcp-oauth-proxy.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.graphCredential.secret.key }}: {{ .Values.graphCredential.secret.value | quote }}
{{- end }}
